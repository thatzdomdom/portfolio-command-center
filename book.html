<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Book — Portfolio Command Center</title>
<link rel="stylesheet" href="pcc.css">
<!--
  book.html — the Mac surface of the 11 Sep 2026 redesign (phase 5, section D). One row per
  holding, a drawer per position, and nothing else.

  Why it exists: the 08:15 brief answers "what should I do this morning" in three minutes on a
  phone. It cannot answer "why did X move". index.html's answer to that was fourteen tabs over a
  holdings array with every number recomputed in the browser from eight Yahoo calls on page load —
  the same load-time-fetch habit that once put a fabricated price in front of the owner. So this
  page fetches NOTHING off-origin: every figure was computed on the Mac by valuate.js,
  technicals.js, targets.js and closes.js, carries its own as-of, and reaches the DOM through
  textContent.

  The join is the whole trick, and it is a known trap: valuation lines carry `t` and `id` but NOT
  `yf`; technicals and closes are keyed by the YAHOO symbol; targets is keyed by `t`. So the chain
  is book.enc(id → yf) × valuation.enc(id) × technicals.json(yf) × closes.json(yf) × targets.json(t).
  Join on ticker instead and eleven cash accounts collapse into one row.

  Twenty of the fifty-nine lines have no price series at all — eleven cash accounts, three
  properties, the PE stake, the fund, the SSB ladder, the margin loan, two penny stubs — and one
  quoted line (L46) had no completed bar in the spine. Those rows say "manual mark" and show the
  mark's age. They never show a return, because a return computed off a mark that has not moved
  since June is a lie with a decimal point. Marks over 90 days old wear an amber stamp;
  trust:'low' prices say so on the price.

  Money lives in book.enc / valuation.enc. Locked, the page still renders: the quoted sleeve comes
  from targets.json — already public, already naming every quoted position — with gate, vol,
  52-week and risk share intact and every value behind Unlock.

  The join lives between the JOIN:BEGIN / JOIN:END markers and is pure (no DOM, no fetch) so it can
  be run under node against the real data files. That is the only way to prove all 59 lines resolve.
-->
<style>
  /* Page-local layout only. Every colour is a pcc.css token; this file defines none of its own.
     `.row` and `.drawer` in pcc.css are flex/block boxes — a <tr> cannot wear them, so the table
     rows use .hrow and the drawer's own contract class sits on the div INSIDE the cell. */
  .book-head{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch;margin:4px 0 12px}
  .book-head .card{flex:1 1 250px;min-width:250px;margin:0}
  .lede{color:var(--ink-2);font-size:13px;margin:4px 0 0;line-height:1.6}
  .k{color:var(--muted);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:600}
  .chips .k{margin-right:4px;align-self:center}
  button.chip{cursor:pointer;font:inherit;font-size:12.5px}
  .note{color:var(--muted);font-size:12px;margin:2px 0 12px;line-height:1.65}
  #tbl{font-size:13.5px} #tbl td{vertical-align:top} #tbl th[data-sort]{cursor:pointer}
  #tbl th:focus-visible{outline:2px solid var(--accent);outline-offset:-2px} #tbl th .dir{color:var(--accent)}
  tr[hidden]{display:none} tr.hrow{cursor:pointer} tr.hrow.open td{background:var(--accent-soft)}
  tr.grp td{background:var(--sunk);font-weight:600;border-bottom:1px solid var(--rule);text-align:left}
  .nm{display:flex;flex-direction:column;gap:1px;min-height:34px;justify-content:center} .nm b{font-weight:600}
  .tk{color:var(--muted);font-size:11.5px;font-family:var(--mono)} .soft{color:var(--muted)}
  .mcell{text-align:left!important;color:var(--muted);font-style:italic}
  .amber{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:0 5px;font-size:11px;font-weight:600;font-style:normal}
  td.dr{padding:0 10px 14px!important;background:var(--sunk);text-align:left}
  /* The drawer lives in a cell of a 14-column table inside .scroll, so it inherits the TABLE's
     width. On a narrow window that pushed the numbers off the right edge, reachable only by
     scrolling the table sideways. Pin it to the scroller's left edge and size it to the window. */
  td.dr > .drawer{position:sticky;left:0;box-sizing:border-box;width:calc(100vw - 48px);max-width:1148px}
  .dw{display:grid;grid-template-columns:minmax(340px,1.7fr) minmax(250px,1fr);gap:10px 24px}
  .dw h3{font-size:13px;margin:10px 0 6px;letter-spacing:-.01em} .dw h3:first-child{margin-top:0}
  .dw dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:12.5px}
  .dw dt{color:var(--muted)} .dw a{color:var(--accent)}
  .dw dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);overflow-wrap:anywhere}
  .dw ul{margin:0;padding:0;list-style:none;font-size:12.5px}
  .dw li{padding:4px 0;border-bottom:1px solid var(--rule-2)}
  .chartbox{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:8px}
  .legend{color:var(--muted);font-size:11.5px;margin:6px 0 0;line-height:1.6}
  .foot{margin-top:24px;color:var(--muted);font-size:12px;line-height:1.8;border-top:1px solid var(--rule);padding-top:12px}
  .foot div{margin-bottom:3px}
  .bootfail{color:var(--bad);font-size:13px;margin:16px 0;line-height:1.6}
  @media(max-width:900px){.dw{grid-template-columns:1fr}}
  @media(max-width:520px){button.chip{min-height:40px}.nm{min-height:40px}}
</style>
</head>
<body>
<div class="wrap wide">
  <div id="navbar"></div>
  <div id="asofbanner"></div>

  <section id="sec-head">
    <h1>Book</h1>
    <p class="lede" id="lede">One row per holding. Click a row for the two-year chart, the filings and the mark behind it.</p>
    <div class="book-head" id="headcards"></div>
  </section>

  <section id="sec-silver"></section>

  <section id="sec-group">
    <div class="chips" id="grpchips"><span class="k">Group by</span></div>
    <p class="note" id="grpnote"></p>
  </section>

  <section id="sec-table">
    <div id="tblerr"></div>
    <div class="scroll"><table id="tbl"><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
    <p class="note" id="tblnote"></p>
  </section>

  <section id="sec-funds"></section>
  <section id="sec-foot"><div class="foot" id="foot"></div></section>
</div>

<script src="common.js"></script>
<script src="funds.js"></script>

<script id="book-core">
/* PURE. No DOM, no fetch. The join and the two series transforms live here so a node harness can
   run them against the real data/*.json and prove every line resolves. */
window.BOOK = (function () {
  'use strict';
  var P = window.PCC || {};

  /* JOIN:BEGIN */
  function sliceTo(series, asOf) {
    if (!asOf) return series || [];
    var out = [], i, s = series || [];
    for (i = 0; i < s.length; i++) { if (s[i].d <= asOf) out.push(s[i]); }
    return out;
  }
  function lastClose(series) {
    for (var i = (series || []).length - 1; i >= 0; i--) { if (series[i].c != null) return series[i]; }
    return null;
  }
  // YTD is a calendar question, not a session count, so it cannot come from retPct(): the base is
  // the last close of the previous year, whatever session that happened to be.
  function ytdPct(series) {
    var end = lastClose(series); if (!end) return null;
    var jan = String(end.d).slice(0, 4) + '-01-01', base = null, i;
    for (i = 0; i < series.length; i++) {
      if (series[i].d >= jan) break;
      if (series[i].c != null) base = series[i];
    }
    if (!base || !base.c) return null;
    return (end.c / base.c - 1) * 100;
  }
  // The 200-day average, aligned one-to-one with the series so PCC.chart can overlay it (chart
  // spreads an overlay across the full width by INDEX, so a short overlay would be drawn stretched
  // and wrong). Before 200 sessions exist the window is shorter and `full` is false — the legend
  // says so, and the gate bands below refuse to use those points.
  function sma200Series(series) {
    var out = [], win = [], sum = 0, i, c, s = series || [];
    for (i = 0; i < s.length; i++) {
      c = s[i].c;
      if (c != null) { win.push(c); sum += c; if (win.length > 200) sum -= win.shift(); }
      out.push({ d: s[i].d, c: win.length ? sum / win.length : null, full: win.length === 200 });
    }
    return out;
  }
  // Gate-OFF spans for the chart's shading. technicals.js turns the gate OFF after 5 consecutive
  // closes below the 200-day (policy.trend.offAfterConsecutiveClosesBelow). The ON leg also needs
  // positive 12-1 momentum, which cannot be reconstructed for the first year of a two-year window,
  // so these bands are the OFF RULE exactly and the legend says that rather than implying the gate.
  function gateOffBands(series, smaS, hyst) {
    var h = hyst || 5, bands = [], run = 0, start = null, i, c, m, s = series || [];
    for (i = 0; i < s.length; i++) {
      m = smaS[i];
      c = s[i].c;
      if (c == null || !m || !m.full || m.c == null) { run = 0; continue; }
      if (c < m.c) { run++; if (run === h) start = s[i - h + 1].d; }
      else { if (start) { bands.push({ from: start, to: s[i - 1].d, kind: 'off' }); start = null; } run = 0; }
    }
    if (start) bands.push({ from: start, to: s[s.length - 1].d, kind: 'off' });
    return bands;
  }
  // Yahoo symbol lookup built from the PUBLIC files. Used only on the locked path, where the book
  // (and therefore `yf`) is not available: the symbol is recovered from technicals/closes keys, it
  // is never guessed by bolting an exchange suffix onto a ticker.
  function symbolIndex(tech, closes) {
    var idx = {}, k;
    var put = function (key, v) { if (key && idx[key] == null) idx[key] = v; };
    var SUF = /\.(SI|HK|AX|KS|T)$/;
    for (k in (tech && tech.instruments) || {}) { put(k, k); put(k.replace(SUF, ''), k); }
    for (k in (closes && closes.instruments) || {}) { put(k, k); put(k.replace(SUF, ''), k); }
    if (!idx.XAG && idx['SI=F']) idx.XAG = idx['SI=F'];   // silver spot rides the futures series
    return idx;
  }
  // book may be null (locked): the quoted sleeve is then rebuilt from targets.json. The unquoted
  // lines do not exist in any public file and the page says so rather than inventing them.
  function joinRows(book, val, tech, tgt, closes, opts) {
    opts = opts || {};
    var asOf = opts.asOf || null;
    var lines = {}, i, L, vlines = (val && val.lines) || [];
    for (i = 0; i < vlines.length; i++) { L = vlines[i]; lines[L.id] = L; }
    var staleWhy = {};
    ((val && val.stale) || []).forEach(function (s) { staleWhy[s.id] = s.why; });
    var tdiff = {};
    ((tgt && tgt.diff) || []).forEach(function (d) { tdiff[d.t] = d; });
    var clusterOf = {};
    ((tgt && tgt.clusters) || []).forEach(function (c) {
      (c.members || []).forEach(function (m) { clusterOf[m] = c; });
    });
    var ti = (tech && tech.instruments) || {}, sidx = symbolIndex(tech, closes);
    var nav = (val && val.navSGD) || null;

    var src;
    if (book && book.holdings && book.holdings.length) {
      src = book.holdings.slice();
    } else {
      src = ((tgt && tgt.diff) || []).map(function (d, k) {
        return { id: 'tgt-' + k, n: d.n, t: d.t, yf: sidx[d.t] || null, ac: null, region: null,
          cur: null, qty: null, valued: 'live', publicOnly: true };
      });
    }

    var dupes = {}, rows = [];
    src.forEach(function (h) { dupes[h.t] = (dupes[h.t] || 0) + 1; });
    src.forEach(function (h) {
      var line = lines[h.id] || null;
      var yf = h.yf || (h.t ? sidx[h.t] : null) || null;
      var t = (yf && ti[yf]) || null;
      var series = yf ? sliceTo(P.closesFor(closes, yf), asOf) : [];
      var quoted = series.length > 1;
      var end = lastClose(series);
      var d = tdiff[h.t] || null, cl = clusterOf[h.t] || null;
      var mark = h.mark || null;
      var manual = h.valued === 'manual' || (line && line.source === 'manual');
      var markAsOf = (line && line.markAsOf) || (mark && mark.asOf) || null;
      var markAge = (line && line.markAgeDays != null) ? line.markAgeDays
        : (markAsOf && P.ageDays ? P.ageDays(markAsOf) : null);
      rows.push({
        id: h.id, t: h.t, n: h.n, yf: yf,
        ac: h.ac || (line && line.ac) || null, region: h.region || null,
        cur: h.cur || (line && line.cur) || null,
        qty: h.qty != null ? h.qty : (line ? line.qty : null),
        valued: h.valued, publicOnly: !!h.publicOnly,
        // eleven lines share the ticker CASH and three share PROP, so the anchor falls back to the
        // id. Every quoted position keeps the spec's plain `pos-<T>`.
        anchor: 'pos-' + h.t + (dupes[h.t] > 1 ? '-' + h.id : ''),
        valueSGD: line ? line.valueSGD : null,
        pctNav: (line && nav) ? (line.valueSGD / nav) * 100 : null,
        dayChgSGD: line ? line.dayChgSGD : null,
        price: line ? line.price : null, priceAsOf: line ? line.priceAsOf : null,
        fx: line ? line.fx : null, native: line ? line.native : null,
        source: line ? line.source : (h.publicOnly ? 'targets.json (public)' : null),
        trust: (line && line.trust) || (t && t.trust) || null,
        markAsOf: markAsOf, markAgeDays: markAge, markSource: mark ? mark.source : null,
        staleWhy: staleWhy[h.id] || null,
        manual: !!manual, quoted: quoted,
        tech: t, series: series, close: end ? end.c : null, closeAsOf: end ? end.d : null,
        gateOn: t ? t.gate.on : (d ? d.gateOn : null),
        vol60: t ? t.vol60 : (d ? d.vol60 : null),
        vol20: t ? t.vol20 : null, volRegime: t ? t.volRegime : null,
        high52w: t ? t.high52w : null, low52w: t ? t.low52w : null, dd52wPct: t ? t.dd52wPct : null,
        r1d: quoted ? P.retPct(series, 1) : null,
        r1w: quoted ? P.retPct(series, 5) : null,
        r1m: quoted ? P.retPct(series, 21) : null,
        rytd: quoted ? ytdPct(series) : null,
        r1y: quoted ? P.retPct(series, 252) : null,
        target: d ? d.target : null, actual: d ? d.actual : null, delta: d ? d.delta : null,
        riskShare: d ? d.riskShareActual : null, cluster: cl
      });
    });
    return rows;
  }
  // alerts.json is keyed by EDGAR ticker; the book's SGX and HKEX codes never appear there and the
  // US lines are ETFs that file no Form 4. The drawer says that out loud instead of showing "0".
  function filingsFor(row, alerts, signals) {
    var keys = {}, out = [], SUF = /\.(SI|HK|AX|KS|T)$/;
    if (row.t) keys[String(row.t).toUpperCase()] = 1;
    if (row.yf) keys[String(row.yf).replace(SUF, '').toUpperCase()] = 1;
    var iso = function (v) { return String(v || '').replace(/^(\d{4})(\d{2})(\d{2})$/, '$1-$2-$3').slice(0, 10); };
    ((alerts && alerts.alerts) || []).forEach(function (a) {
      if (a.ticker && keys[String(a.ticker).toUpperCase()]) {
        out.push({ date: iso(a.date), kind: a.family || 'alert', text: a.headline, url: a.url, id: a.id });
      }
    });
    ((signals && signals.form4) || []).forEach(function (f) {
      var tk = f.issuer && f.issuer.ticker;
      if (tk && keys[String(tk).toUpperCase()]) {
        out.push({ date: iso(f.filed), kind: 'Form 4', text: (f.issuer.name || tk) + ' — Form 4', url: f.url, id: f.id });
      }
    });
    ((signals && signals.sc13) || []).forEach(function (f) {
      var tk = f.issuer && f.issuer.ticker;
      if (tk && keys[String(tk).toUpperCase()]) {
        out.push({ date: iso(f.filed), kind: f.form || '13D/G', text: (f.issuer.name || tk) + ' — ' + (f.form || '13D/G'), url: f.url, id: f.id });
      }
    });
    out.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    return out;
  }
  /* JOIN:END */

  return { joinRows: joinRows, filingsFor: filingsFor, sma200Series: sma200Series,
    gateOffBands: gateOffBands, ytdPct: ytdPct, symbolIndex: symbolIndex, sliceTo: sliceTo };
})();
</script>

<script id="book-view">
(function () {
  'use strict';
  var P = window.PCC || {}, B = window.BOOK || {};

  // ── contract guard ──────────────────────────────────────────────────────
  // This page is built on the phase-5 PCC surface (spec §B). If common.js has not been extended,
  // say which piece is missing rather than rendering a blank page with a console error.
  var NEED = ['load', 'loadAll', 'priv', 'locked', 'unlock', 'money', 'pct', 'num', 'dateShort',
    'dateLong', 'ago', 'el', 'closesFor', 'retPct', 'spark', 'chart', 'nav', 'asof', 'asofBanner',
    'deepLink', 'hash', 'gateLabel', 'err', 'stampHTML', 'sgtToday', 'ageDays'];
  var missing = NEED.filter(function (k) { return typeof P[k] !== 'function'; });
  if (missing.length) {
    var fail = document.createElement('p');
    fail.className = 'bootfail';
    fail.textContent = 'book.html needs the phase-5 common.js (spec §B). Missing from window.PCC: '
      + missing.join(', ') + '. Nothing is rendered rather than rendered wrong.';
    document.getElementById('sec-head').appendChild(fail);
    return;
  }

  var E = P.el, $ = function (s) { return document.querySelector(s); };
  // [sort key, heading]. Every column sorts except the sparkline, which has nothing to sort ON.
  var COLS = [['nm', 'Holding'], ['val', 'Value'], ['nav', '% NAV'], ['r1d', '1D'], ['r1w', '1W'],
    ['r1m', '1M'], ['rytd', 'YTD'], ['r1y', '1Y'], ['gate', 'Gate'], ['vol', 'Vol'],
    ['dd', 'From 52w high'], ['risk', 'Risk share'], ['fil', 'Filing'], ['spk', 'Trend', false]
  ].map(function (c) { return { label: c[1], sort: c[2] === false ? null : c[0] }; });
  var NCOL = COLS.length;
  var GROUPS = [
    { key: 'none', label: 'none' }, { key: 'ac', label: 'asset class' },
    { key: 'region', label: 'region' }, { key: 'cur', label: 'currency' },
    { key: 'cluster', label: 'cluster' }, { key: 'theme', label: 'theme' }
  ];
  var S = { rows: [], grp: 'none', sort: 'val', dir: -1, sortTouched: false, locked: true, open: {},
    book: null, val: null, tech: null, tgt: null, closes: null, alerts: null, signals: null, man: null };

  function groupOf(row) {
    if (S.grp === 'none') return null;
    if (S.grp === 'cluster') return row.cluster ? row.cluster.name : 'no cluster — unquoted or unmodelled';
    // `theme` is the book's own `ac` field (spec §D). There is no separate theme taxonomy on disk
    // and inventing one would be a label with no source, so the two chips agree by construction.
    var k = S.grp === 'theme' ? 'ac' : S.grp;
    if (row[k]) return row[k];
    // Asset class, region and currency are attributes of the BOOK, and targets.json does not carry
    // them — so on the locked path they are genuinely unknown rather than "unclassified".
    return row.publicOnly ? 'not in the public file — unlock to group by this' : 'unclassified';
  }
  function sortVal(row, key) {
    switch (key) {
      case 'nm': return String(row.n || row.t || '').toLowerCase();
      case 'val': return row.valueSGD;
      case 'nav': return row.pctNav;
      case 'gate': return row.gateOn === true ? 2 : row.gateOn === false ? 0 : 1;
      case 'vol': return row.vol60;
      case 'dd': return row.dd52wPct;
      case 'risk': return row.riskShare;
      case 'fil': return row.filings && row.filings.length ? row.filings[0].date : null;
      default: return row[key];
    }
  }

  // ── cells ───────────────────────────────────────────────────────────────
  function retCell(v) {
    var td = E('td', { class: 'num' });
    if (v == null) { td.appendChild(E('span', { class: 'soft', text: '—' })); return td; }
    td.appendChild(E('span', { class: v > 0 ? 'up' : v < 0 ? 'down' : 'flatnum',
      text: P.pct(v, { dp: 1, sign: true }) }));
    return td;
  }
  function stampInto(node, asOf, cadence, what) {
    // stampHTML builds its markup from this file's own literals plus an ISO date. No fetched text
    // goes through it; every value on this page uses PCC.el's `text`.
    node.innerHTML = P.stampHTML(asOf, cadence, what);
    return node;
  }
  // PCC.gateLabel answers for the two boolean states. technicals.js also emits 'pending-off' — below
  // the 200-day but not yet through the 5-close hysteresis — and gateLabel renders that as 'gate —',
  // which reads like missing data rather than like a state. Name it.
  function gatePill(row) {
    var gt = row.tech && row.tech.gate;
    if (gt && typeof gt.on !== 'boolean' && gt.on != null) {
      return E('span', { class: 'pill warn',
        text: 'gate ' + String(gt.on) + (gt.belowStreak ? ' ' + gt.belowStreak + 'd' : '') });
    }
    if (row.tech) { var g = P.gateLabel(row.tech); return E('span', { class: 'pill ' + g.cls, text: g.text }); }
    if (row.gateOn == null) return E('span', { class: 'pill flat', text: 'no series' });
    return E('span', { class: 'pill ' + (row.gateOn ? 'good' : 'bad'), text: row.gateOn ? 'gate ON' : 'gate OFF' });
  }
  function markNote(row) {
    var span = E('span', {});
    if (row.markAgeDays != null && row.markAgeDays > 90) {
      span.appendChild(E('span', { class: 'amber', text: 'mark ' + row.markAgeDays + 'd old' }));
    } else if (row.markAsOf) {
      span.appendChild(E('span', { class: 'tk', text: 'marked ' + P.dateShort(row.markAsOf) }));
    } else {
      span.appendChild(E('span', { class: 'tk', text: 'no mark date' }));
    }
    return span;
  }

  function headRow() {
    var tr = $('#thead'); tr.textContent = '';
    COLS.forEach(function (c) {
      var th = E('th', { text: c.label });
      if (c.sort) {
        th.tabIndex = 0;
        th.setAttribute('role', 'columnheader');
        th.setAttribute('data-sort', c.sort);
        th.setAttribute('aria-sort', S.sort === c.sort ? (S.dir < 0 ? 'descending' : 'ascending') : 'none');
        if (S.sort === c.sort) th.appendChild(E('span', { class: 'dir', text: S.dir < 0 ? ' ▾' : ' ▴' }));
      }
      tr.appendChild(th);
    });
  }

  function holdingRow(row) {
    var tr = E('tr', { class: S.open[row.anchor] ? 'hrow open' : 'hrow' });
    tr.id = 'row-' + row.anchor;
    tr.setAttribute('data-anchor', row.anchor);
    tr.setAttribute('aria-expanded', S.open[row.anchor] ? 'true' : 'false');
    tr.setAttribute('aria-controls', row.anchor);

    tr.appendChild(E('td', {}, [E('div', { class: 'nm' }, [

  // ── the table ───────────────────────────────────────────────────────────
  function body() {
    var tb = $('#tbody'); tb.textContent = '';
    var rows = S.rows.slice(), key = S.sort, dir = S.dir;
    var counts = {}, sums = {}, order = [];
    rows.forEach(function (r) {
      var g = groupOf(r); if (g == null) return;
      if (counts[g] == null) { counts[g] = 0; sums[g] = 0; order.push(g); }
      counts[g]++;
      sums[g] += (r.valueSGD || 0);
    });
    // A group is only a group if its rows stay together, so the group is the PRIMARY key and the
    // clicked column sorts within it. Groups themselves run by size of money when there is money to
    // sort by, alphabetically when locked, with the leftover bucket last either way.
    var anyValue = order.some(function (g) { return sums[g] !== 0; });
    var leftover = function (g) { return /^no cluster|^unclassified/.test(g) ? 1 : 0; };
    order.sort(function (a, b) {
      if (leftover(a) !== leftover(b)) return leftover(a) - leftover(b);
      if (anyValue) return Math.abs(sums[b]) - Math.abs(sums[a]);
      return a < b ? -1 : a > b ? 1 : 0;
    });
    var rank = {}; order.forEach(function (g, i) { rank[g] = i; });
    var byKey = function (a, b) {
      var x = sortVal(a, key), y = sortVal(b, key);
      if (x == null && y == null) return 0;
      if (x == null) return 1;            // blanks sink whichever way the arrow points
      if (y == null) return -1;
      if (typeof x === 'string' || typeof y === 'string') {
        x = String(x); y = String(y);
        return x < y ? -dir : x > y ? dir : 0;
      }
      return (x - y) * dir;
    };
    rows.sort(function (a, b) {
      if (S.grp !== 'none') {
        var ra = rank[groupOf(a)], rb = rank[groupOf(b)];
        if (ra !== rb) return ra - rb;
      }
      return byKey(a, b);
    });
    var frag = document.createDocumentFragment(), last = null;
    rows.forEach(function (r) {
      var g = groupOf(r);
      if (g !== last) {
        last = g;
        if (g != null) {
          var gr = E('tr', { class: 'grp' });
          var gt = E('td', {});
          gt.colSpan = NCOL;
          gt.appendChild(E('span', { text: g + '  ·  ' + counts[g] + (counts[g] === 1 ? ' line' : ' lines') }));
          if (!S.locked && S.val && S.val.navSGD) {
            gt.appendChild(E('span', { class: 'tk', text: '   ' + P.money(sums[g], { cur: 'SGD', dp: 0 })
              + '  ·  ' + P.pct((sums[g] / S.val.navSGD) * 100, { dp: 2, sign: false }) + ' of NAV' }));
          }
          gr.appendChild(gt);
          frag.appendChild(gr);
        }
      }
      frag.appendChild(holdingRow(r));
      frag.appendChild(drawerRow(r));
    });
    tb.appendChild(frag);
    var note = $('#tblnote');
    note.textContent = rows.length + ' lines. Returns are price returns in the line’s own currency, '
      + 'straight from data/closes.json — no FX, no dividends. Values and % of NAV are SGD, from valuation.enc.';
  }

    f.appendChild(E('div', { text:
      'Every figure here was computed on this Mac before the page loaded; the browser makes zero '
      + 'external calls. NAV history is not published, so this page does not draw one.' }));
  }

  // Phase 6: the Funds (13F) section — EDGAR tables parsed by scripts/13f-scan.js. Public data, so it
  // renders locked. funds.js failing to load must read as a missing section, never as a quiet quarter.
  function funds() {
    var sec = $('#sec-funds'); sec.textContent = '';
    if (!window.FUNDS) { sec.appendChild(P.err('funds.js did not load, so the Funds (13F) section is missing — not empty.')); return; }
    window.FUNDS.render(sec, S.f13, S.rows);
  }

  // ── boot ────────────────────────────────────────────────────────────────
  function openFromHash() {
    var h = String(P.hash() || '').replace(/^#/, '');
    if (!h) return;
    var target = document.getElementById(h);
    if (!target || S.open[h]) return;
    toggle(h);
    try { target.scrollIntoView({ block: 'center' }); } catch (_) { target.scrollIntoView(); }
  }

  function boot(afterUnlock) {
    var bar = $('#navbar');
    if (!bar.firstChild) bar.appendChild(P.nav('book'));
    var banner = P.asofBanner(), slot = $('#asofbanner');
    slot.textContent = '';
    if (banner) slot.appendChild(banner);

    P.loadAll(['closes.json', 'technicals.json', 'targets.json', 'alerts.json', 'signals.json', 'manifest.json', '13f.json'])
      .then(function (pub) {
        S.closes = pub['closes.json']; S.tech = pub['technicals.json']; S.tgt = pub['targets.json'];
        S.alerts = pub['alerts.json']; S.signals = pub['signals.json']; S.man = pub['manifest.json'];
        S.f13 = pub['13f.json'];
        if (P.locked() && !afterUnlock) return [null, null];
        return Promise.all([P.priv('book'), P.priv('valuation')]);
      })
      .then(function (pr) {
        S.book = pr[0]; S.val = pr[1];
        S.locked = !(S.val && S.val.navSGD);
        S.rows = window.BOOK.joinRows(S.book, S.val, S.tech, S.tgt, S.closes, { asOf: P.asof() });
        S.rows.forEach(function (r) { r.filings = window.BOOK.filingsFor(r, S.alerts, S.signals); });

        // Locked, every value is null and a sort by Value degenerates into file order. Risk share is
        // public, so that is the honest default until he unlocks or picks a column himself.
        if (!S.sortTouched) S.sort = S.locked ? 'risk' : 'val';

        var e = $('#tblerr'); e.textContent = '';
        if (!S.closes) e.appendChild(P.err('data/closes.json did not load — every return and every chart on this page is blank. It is written by scripts/closes.js.'));
        if (!S.tech) e.appendChild(P.err('data/technicals.json did not load — the gate, vol and 52-week columns are blank.'));
        if (!S.tgt) e.appendChild(P.err('data/targets.json did not load — risk share, cluster grouping and the target weights are blank.'));
        if (!S.book && S.val && S.rows.length) {
          $('#tblerr').appendChild(P.err('The holdings list came from targets.json, not book.enc — so the '
            + (S.val.lines ? S.val.lines.length - S.rows.length : 21) + ' unquoted lines (cash, property, the PE stake, '
            + 'the SSB ladder, the margin loan) are missing from this table even though they are inside the '
            + 'net worth above. Reload, or unlock again, to get the full book.'));
        }
        if (S.locked && !S.book && S.rows.length) {
          $('#lede').textContent = 'Locked: ' + S.rows.length + ' quoted lines, rebuilt from the public '
            + 'policy file. The unquoted lines — cash, property, the PE stake, the SSB ladder, the margin '
            + 'loan — exist only in book.enc, and every value needs the passphrase.';
        }
        if (P.asof()) {
          $('#tblerr').appendChild(P.err('Viewing as of ' + P.asof() + ': the price series are truncated to that '
            + 'date, but gate, vol, the 52-week range and every value are as of their own files’ dates below. '
            + 'This page cannot rewind a mark it was never given.'));
        }
        header(); silver(); chips(); note(); headRow(); body(); foot();
        funds();
        openFromHash();
      })
      .catch(function (e) {
        var box = $('#tblerr');
        box.appendChild(P.err('The book did not render: ' + (e && e.message ? e.message : String(e))));
      });
  }

  $('#tbody').addEventListener('click', function (ev) {
    if (ev.target.closest && ev.target.closest('a')) return;
    var tr = ev.target.closest && ev.target.closest('tr.hrow');
    if (tr && tr.getAttribute('data-anchor')) toggle(tr.getAttribute('data-anchor'));
  });
  $('#thead').addEventListener('click', function (ev) {
    var th = ev.target.closest && ev.target.closest('th');
    if (!th || !th.getAttribute('data-sort')) return;
    var k = th.getAttribute('data-sort');
    S.sortTouched = true;
    if (S.sort === k) S.dir = -S.dir; else { S.sort = k; S.dir = k === 'nm' ? 1 : -1; }
    headRow(); body();
  });
  $('#thead').addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    var th = ev.target.closest && ev.target.closest('th');
    if (!th || !th.getAttribute('data-sort')) return;
    ev.preventDefault();
    th.click();
  });
  window.addEventListener('hashchange', openFromHash);

  boot(false);
})();
</script>
</body></html>
